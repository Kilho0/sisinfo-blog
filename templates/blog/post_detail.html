{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <article>
    <header class="post-header">
      <p class="eyebrow"><a href="{% url 'post_list' %}">← Todos os posts</a></p>
      <h1 class="page-title">{{ post.title }}</h1>
      <span class="meta">Publicado em {{ post.date|date:"d/m/Y \à\s H:i" }}</span>
    </header>

    <div class="card prose">
      {{ post.content|safe }}
    </div>

    <div class="actions">
      <a class="btn" href="{% url 'post_update' post.pk %}">Editar post</a>
      <a class="btn btn-ghost-danger" href="{% url 'post_delete' post.pk %}">Remover post</a>
    </div>
  </article>
{% endblock %}
