{% extends 'base.html' %}

{% block title %}Trocar senha{% endblock %}

{% block content %}
  <div class="auth">
    <p class="eyebrow">Conta</p>
    <h1 class="page-title">Trocar senha</h1>
    <form class="card form-card" method="post" novalidate>
      {% csrf_token %}
      {% include 'includes/form_fields.html' %}
      <div class="actions">
        <button class="btn btn-primary" type="submit">Salvar senha</button>
        <a class="btn" href="{% url 'profile_edit' %}">Cancelar</a>
      </div>
    </form>
  </div>
{% endblock %}
